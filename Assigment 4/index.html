<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Setup Form</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Page Heading -->
        <h1>Game Setup</h1>

        <!-- Game Form -->
        <form id="gameForm">
            <!-- Username input -->
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your username" required>

            <!-- Weapons input -->
            <label for="weapons">Weapons:</label>
            <input type="text" id="weapons" placeholder="Choose your weapon" required>

            <!-- Health/Damage input -->
            <label for="health">Health/Damage:</label>
            <input type="number" id="health" placeholder="Enter health points" required>

            <!-- Point Total input -->
            <label for="points">Point Total:</label>
            <input type="number" id="points" placeholder="Enter starting points" required>

            <!-- Buttons -->
            <div class="btn-container">
                <!-- Submit button triggers JS function -->
                <button type="button" onclick="submitForm()">Submit</button>
                <!-- Reset button clears form and output -->
                <button type="reset" onclick="clearOutput()">Reset</button>
            </div>
        </form>

        <!-- Output area for displaying user input -->
        <div id="output">
            <h3>Game Info:</h3>
            <p id="result">No data entered yet.</p>
        </div>
    </div>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
