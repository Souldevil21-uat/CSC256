<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillSwap Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SkillSwap Hub</h1>
    <p>Connect. Learn. Grow.</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Set Up Your Profile</h2>
      <form id="profileForm">
        <label>Name: <input type="text" id="name" placeholder="Your name here" required></label>
        <label>Role: <input type="text" id="role" placeholder="e.g., Web Developer, Artist" required></label>
        <label>Skills Offered: <input type="text" id="skillsOffered" placeholder="e.g., JavaScript, Python" required></label>
        <label>Skills Wanted: <input type="text" id="skillsWanted" placeholder="e.g., UX Design, SQL" required></label>
        <label>Availability:
          <select id="availability" required>
            <option value="">Select Your Weekly Availability</option>
            <option value="Weekdays">Weekdays</option>
            <option value="Weekends">Weekends</option>
            <option value="Evenings">Evenings</option>
            <option value="Anytime">Anytime</option>
          </select>
        </label>
        <button type="submit">Save Profile</button>
      </form>
    </section>

    <section id="matchSection">
      <h2>Your Matches</h2>
      <ul id="matchList"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 SkillSwap Hub. All rights reserved.</p>
  </footer>

  <!-- External JavaScript Modules -->
  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
